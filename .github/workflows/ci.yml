name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + lint + design-system guard (monochrome accent + AA contrast)
      - name: Check
        run: npm run check

      - name: Dead-code audit
        run: npm run audit:dead

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preuve — proof.json
        if: always()
        env: { JOB_STATUS: "${{ job.status }}" }
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("proof.json",JSON.stringify({repo:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,run_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,status:process.env.JOB_STATUS,generated_by:"ci (jamais par un agent)",ts:new Date().toISOString()},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: proof, path: proof.json, retention-days: 30 }
