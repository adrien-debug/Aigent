name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annulation des runs superflus — asymétrique, et c'est délibéré.
#
# Défaut corrigé : `cancel-in-progress: true` s'appliquait AUSSI à `main`. Chaque
# push sur `main` tuait le run précédent, qui n'avait pas encore conclu (voir le
# job `sonarqube` ci-dessous). Sur les 100 derniers runs : 0 succès, 77
# `cancelled`. Le run de `main` porte la preuve de l'état du tronc — il doit
# atteindre un état terminal, même si un autre push suit.
#
# Sur une PR au contraire, un nouveau push rend le run précédent périmé : celui-là
# est annulable sans perte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    # Mesuré : ce job conclut en ~2 min. 20 min laisse une marge large tout en
    # garantissant qu'une étape bloquée conclut au lieu de suspendre le run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:secrets` scanne tout l'historique — un clone superficiel
          # ne verrait qu'un commit et laisserait passer une fuite ancienne.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Configure npm registries
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Missing required secret NPM_TOKEN for @motionplus/core (api.motion.dev)"
            exit 1
          fi
          cat > "$RUNNER_TEMP/.npmrc" <<EOF
          registry=https://registry.npmjs.org/
          @motionplus:registry=https://api.motion.dev/npm/
          //api.motion.dev/:_authToken=${NPM_TOKEN}
          always-auth=false
          EOF
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npm config get registry
          npm config get @motionplus:registry
          npm ci

      # Requis par `npm run check:secrets` (étape de `npm run check`) —
      # gitleaks est absent des runners GitHub par défaut.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # typecheck + oxlint + eslint + gardes de structure, de vérité et de secrets.
      # Chaîne entièrement statique et hors ligne : aucune étape n'appelle la base
      # live (cf. AGENTS.md § Gates). La composition exacte est dans package.json.
      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preuve — proof.json
        if: always()
        env: { JOB_STATUS: "${{ job.status }}" }
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("proof.json",JSON.stringify({repo:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,run_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,status:process.env.JOB_STATUS,generated_by:"ci (jamais par un agent)",ts:new Date().toISOString()},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: proof, path: proof.json, retention-days: 30 }

  # SonarQube — OPTIONNEL, et désactivé par défaut.
  #
  # Ce job cible un runner self-hosted GPU1 (Tailscale). Mesuré le 2026-08-03 :
  # `gh api repos/adrien-debug/Aigent/actions/runners` renvoie
  # `{"total_count":0,"runners":[]}` — AUCUN runner n'est enregistré sur le
  # dépôt. Un job dont le label ne matche aucun runner ne échoue pas : il reste
  # `queued` indéfiniment (des runs observés à plus de 13 h), et le run entier
  # n'atteint jamais d'état terminal. `continue-on-error: true` n'y changeait
  # rien — il ne couvre qu'un job qui CONCLUT en échec, jamais un job qui ne
  # démarre pas.
  #
  # Correctif : l'exécution est conditionnée à une variable de dépôt explicite
  # `SONAR_SELF_HOSTED_RUNNER_ONLINE`. Tant qu'elle ne vaut pas '1', le job est
  # `skipped` — il ne suspend plus le run et n'annule plus rien. Quand un runner
  # GPU1 sera réellement enregistré, poser la variable à '1' le réarme, sans
  # toucher au workflow.
  #
  # `timeout-minutes` est le garde-fou de dernier recours : même la variable
  # posée à tort (runner déclaré mais hors ligne), le job meurt en 20 min au lieu
  # de suspendre le run pendant des heures.
  #
  # Aucune GitHub Action n'a été ajoutée ici : le dépôt préfère les gates locales,
  # et `npm run check` (job ci-dessus) reste la seule chaîne bloquante.
  sonarqube:
    name: SonarQube analysis (optional)
    if: vars.SONAR_SELF_HOSTED_RUNNER_ONLINE == '1'
    runs-on: [self-hosted, gpu1]
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm -v "$PWD":/usr/src -e SONAR_TOKEN sonarsource/sonar-scanner-cli
