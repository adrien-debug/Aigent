name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:secrets` scanne tout l'historique — un clone superficiel
          # ne verrait qu'un commit et laisserait passer une fuite ancienne.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requis par `npm run check:secrets` (étape de `npm run check`) —
      # gitleaks est absent des runners GitHub par défaut.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # typecheck + oxlint + eslint + gardes de structure, de vérité et de secrets.
      # Chaîne entièrement statique et hors ligne : aucune étape n'appelle la base
      # live (cf. AGENTS.md § Gates). La composition exacte est dans package.json.
      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preuve — proof.json
        if: always()
        env: { JOB_STATUS: "${{ job.status }}" }
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("proof.json",JSON.stringify({repo:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,run_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,status:process.env.JOB_STATUS,generated_by:"ci (jamais par un agent)",ts:new Date().toISOString()},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: proof, path: proof.json, retention-days: 30 }

  # SonarQube — GPU1 self-hosted runner only (Tailscale, 100.88.191.49:9010).
  sonarqube:
    name: SonarQube analysis
    runs-on: [self-hosted, gpu1]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm -v "$PWD":/usr/src -e SONAR_TOKEN sonarsource/sonar-scanner-cli
