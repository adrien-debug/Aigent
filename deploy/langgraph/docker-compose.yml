# LangGraph Agent Server — production compose for gpu1 (Aigent / agent_builder)
#
# Run from the REPO ROOT (the build context must be the repo root, because
# langgraph.json + src/langgraph live there):
#
#   docker compose -f deploy/langgraph/docker-compose.yml up -d --build
#
# Provide secrets via a .env file next to this compose OR via the shell env.
# NEVER hardcode secrets here — every value below is ${VAR} indirection.
# See README.md for where each value comes from.
#
# TWO CONTAINERS:
#   - agent-server: the free `langgraphjs dev` server (in-memory + a persistent
#     volume over /app/.langgraph_api so runs awaiting approval survive a
#     restart). NOT published to the host — only the caddy front reaches it.
#   - caddy: a front proxy that hard-DENIES /internal/* (the server's
#     unauthenticated admin routes, e.g. /internal/truncate) and forwards the
#     rest to agent-server. Caddy is the only container published to the host
#     (127.0.0.1:8098), and it is what the Cloudflare tunnel points at.

services:
  agent-server:
    build:
      # Build context = repo root (two levels up from this file).
      context: ../..
      dockerfile: deploy/langgraph/Dockerfile
    image: aigent-langgraph:local
    container_name: aigent-langgraph
    restart: always
    # No host `ports:` — the server is reachable only in-network, via caddy.
    expose:
      - "2024"
    # The Docker embedded resolver (127.0.0.11) on nexus-net forwards to invalid
    # upstream servers (confirmed 2026-07-16): external lookups (api.openai.com)
    # fail EAI_AGAIN, so the graph's OpenAI calls error "Connection error."
    # intermittently. Explicit public resolvers bypass the broken embedded
    # forwarder — the same workaround the app compose already carries.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # --- Auth gate (fail-closed). REQUIRED or the server 503s every request. ---
      # Note: /internal/* routes are NOT covered by this auth gate — they are
      # instead hard-blocked at the edge by the caddy front (see the caddy
      # service below / Caddyfile). Auth and the /internal/* block are two
      # separate, complementary layers.
      LANGGRAPH_SERVER_SECRET: ${LANGGRAPH_SERVER_SECRET:?set LANGGRAPH_SERVER_SECRET}

      # --- Graph runtime needs these (tools call Supabase PostgREST). ---
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      AGENT_BUILDER_MODEL: ${AGENT_BUILDER_MODEL:-gpt-5.4}
      # The graph's read-only tools call ${AMC_SUPABASE_URL}/rest/v1/… . On the
      # nexus-net network the aigent PostgREST perimeter is reached internally at
      # http://aigent-caddy:8095 (verified: 200 with the service role).
      AMC_SUPABASE_URL: ${AMC_SUPABASE_URL:-http://aigent-caddy:8095}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      AMC_DATA_SOURCE: ${AMC_DATA_SOURCE:-gpu1}
      # The per-copilot repo tools (read_repo_file/list_repo_tree/search_repo,
      # tool-registry.mjs) call the live GitHub API — they need the token in the
      # SERVER process (this container), not just the app. Without it every repo
      # call 404s. Optional (empty → repo tools return an auth error, not a crash).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # --- Market tools bridge. The market reads (read_market_snapshot, …) in
      # tool-registry.mjs call back into the app at
      # ${AIGENT_INTERNAL_URL}/api/agent-ops/market-tools/<id> with AMC_API_KEY.
      # On nexus-net the app is reachable at aigent-app:3000. Without these the
      # market tools return "bridge unavailable: AMC_API_KEY not configured" and
      # a langgraph run binds zero tools (parallel_tool_calls error / no data).
      AMC_API_KEY: ${AMC_API_KEY:-}
      AIGENT_INTERNAL_URL: ${AIGENT_INTERNAL_URL:-http://aigent-app:3000}

      # --- OPTIONAL tracing (absent → no-op). ---
      # LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}

    volumes:
      # Persist checkpoints/threads/runs across restarts (the whole point — the
      # langgraphjs dev server checkpoints to files here, not to Postgres).
      - aigent_langgraph_state:/app/.langgraph_api

    networks:
      # Reach the aigent PostgREST perimeter (aigent-caddy:8095) internally.
      - nexus-net

    healthcheck:
      # /ok is public (exempt from auth) — liveness for the dev server.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2024/ok').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2
    container_name: aigent-langgraph-caddy
    restart: always
    depends_on:
      agent-server:
        condition: service_healthy
    # The ONLY container published to the host; the Cloudflare tunnel targets
    # 127.0.0.1:8098. Caddy denies /internal/* and proxies the rest.
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - nexus-net

volumes:
  aigent_langgraph_state:
    driver: local

networks:
  nexus-net:
    external: true
