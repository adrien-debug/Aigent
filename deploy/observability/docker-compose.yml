# Stack d'observabilité locale — AIGENT-VISUAL-STACK-002
#
# Isolée à dessein : cette machine héberge d'autres chantiers (Supabase local,
# Postgres de hermes/hpb/mamo). Rien n'est réutilisé ici, tout est nommé
# `aigent-obs-*` sur des volumes dédiés, dans une bande de ports (3801-3803)
# vérifiée libre au 2026-08-01.
#
# Démarrage :  docker compose --env-file .env -p aigent-obs up -d
# Arrêt      :  docker compose -p aigent-obs down
# Purge      :  docker compose -p aigent-obs down -v   (détruit les volumes)

name: aigent-obs

services:
  # ---------------------------------------------------------------- Langfuse
  langfuse-db:
    image: postgres:16-alpine
    container_name: aigent-obs-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    container_name: aigent-obs-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3801:3000'
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3801
      NEXTAUTH_SECRET: ${LANGFUSE_SALT}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
      # Auto-provisionne l'organisation, le projet et les clés API : sans cela
      # la première trace exigerait un login graphique manuel.
      LANGFUSE_INIT_ORG_ID: aigent
      LANGFUSE_INIT_ORG_NAME: Aigent
      LANGFUSE_INIT_PROJECT_ID: aigent-local
      LANGFUSE_INIT_PROJECT_NAME: Aigent (local)
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Operateur local
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    healthcheck:
      # 127.0.0.1 et non `localhost` : ces images résolvent `localhost` en
      # IPv6 (::1) alors qu'elles écoutent en IPv4 — le healthcheck échouait
      # (« Connection refused ») sur un service parfaitement joignable.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/public/health']
      interval: 10s
      timeout: 5s
      retries: 30

  # -------------------------------------------------------------- Prometheus
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: aigent-obs-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:3804:9090'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # La clé d'API est montée en fichier, jamais inscrite dans le YAML
      # versionné ni dans une variable visible via `docker inspect`.
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Aigent tourne sur l'hôte (3987) : ce conteneur doit sortir le joindre.
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------- Grafana
  grafana:
    image: grafana/grafana:11.3.0
    container_name: aigent-obs-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3802:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: 'marcusolsson-json-datasource'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------- n8n
  n8n:
    image: n8nio/n8n:1.68.0
    container_name: aigent-obs-n8n
    restart: unless-stopped
    ports:
      - '127.0.0.1:3803:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PORT: '5678'
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:3803/
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Console locale sans login : le port n'est publié que sur 127.0.0.1.
      N8N_USER_MANAGEMENT_DISABLED: 'true'
      N8N_SECURE_COOKIE: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      GENERIC_TIMEZONE: Europe/Paris
      # Autorise les nœuds Code à lire process.env — sans quoi `$env.AMC_API_KEY`
      # est vide et le workflow ne peut pas s'authentifier auprès d'Aigent.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      # Injectées depuis .env (gitignoré) : la clé n'est jamais dans un fichier
      # versionné, ni dans le JSON du workflow.
      AMC_API_KEY: ${AMC_API_KEY}
      AIGENT_PORT: ${AIGENT_PORT:-3988}
    extra_hosts:
      # Aigent tourne sur l'hôte, pas dans ce réseau Docker.
      - 'host.docker.internal:host-gateway'
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      # Voir la note IPv6 du healthcheck Langfuse.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  prometheus-data:
    name: aigent-obs-prometheus-data
  langfuse-db-data:
    name: aigent-obs-langfuse-db-data
  grafana-data:
    name: aigent-obs-grafana-data
  n8n-data:
    name: aigent-obs-n8n-data
